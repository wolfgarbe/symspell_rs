[package]
name = "symspell_rs"
version = "6.8.4"
authors = ["Wolf Garbe <Wolf Garbe wolf.garbe@seekstorm.com>"]
license = "MIT"
categories = ["database-implementations", "data-structures"]
description = "Spelling correction & Fuzzy search"
documentation = "https://docs.rs/symspell_rs/"
homepage = "https://github.com/wolfgarbe/symspell_rs"
repository = "https://github.com/wolfgarbe/symspell_rs"
readme = "README.md"
keywords = ["spellcheck"]
exclude = ["data/*", ".*"]
rust-version = '1.91'
edition = "2024"

[lib]
name = "symspell_rs"
crate-type = ["cdylib", "rlib"]

[features]
gxhash = ["dep:gxhash"] # Activate gxhash when you hardware supports AES/SSE2 and you want faster hash computation.

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
ahash ={ version = "0.8.12", features = ["serde"]}
gxhash = { version = "3.5.0", features = ["deterministic"], optional = true }

regex = "1.12.3"
strsim = "0.11.1"
smallvec = "1.16.2"
unicode-normalization = "0.1.25"
itertools = "0.15.0"

[workspace.lints.rust]
missing_docs = "warn"
unused_import_braces = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"

[profile.release]
lto = true
opt-level = 3
debug = false
debug-assertions = false
panic = "abort"
overflow-checks = false
strip = "debuginfo"

[package.metadata.docs.rs]
rustc-args = ["-C", "target-cpu=native"]
rustdoc-args = ["-C", "target-cpu=native"]
